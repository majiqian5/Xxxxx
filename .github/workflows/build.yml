name: build-deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          brew install ldid xz || true
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
      - name: Build rootless deb
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LyricBubble-deb
          path: packages/*.deb
