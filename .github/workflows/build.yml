name: Build DIPlus
true:
- push
- workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Theos
      run: 'export THEOS=~/theos

        git clone --recursive https://github.com/theos/theos.git $THEOS

        curl -L https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz

        tar -xzf /tmp/sdks.tar.gz -C /tmp

        cp -r /tmp/sdks-master/*.sdk $THEOS/sdks/

        echo "THEOS=$THEOS" >> $GITHUB_ENV'
    - name: Create source files
      run: 'mkdir -p layout/DEBIAN

        echo ''''
        | base64 -d > Tweak.xm

        echo ''''
        | base64 -d > Makefile

        echo ''UGFja2FnZTogY29tLnVzZXIuZGlwbHVzCk5hbWU6IOeBteWKqOWym+WinuW8ugpWZXJzaW9uOiA0LjAuMApBcmNoaXRlY3R1cmU6IGlwaG9uZW9zLWFybTY0CkRlc2NyaXB0aW9uOiDngbXliqjlspvlop7lvLoKTWFpbnRhaW5lcjogVXNlcgpBdXRob3I6IFVzZXIKU2VjdGlvbjogVHdlYWtzCkRlcGVuZHM6IG1vYmlsZXN1YnN0cmF0ZQo=''
        | base64 -d > layout/DEBIAN/control'
    - name: Build
      run: 'export THEOS=~/theos

        export PATH=$THEOS/bin:$PATH

        make clean package FINALPACKAGE=1'
    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: DIPlus-deb
        path: packages/*.deb
